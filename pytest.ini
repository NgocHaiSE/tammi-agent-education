# pytest.ini - Test Configuration for tammi-agent-chitchat
# Updated: 2025-10-29

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude manual/debug scripts and specific directories
# Also exclude integration/e2e when running unit tests to avoid import errors
norecursedirs = .git .tox .env venv manual fixtures helpers __pycache__ .pytest_cache

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Markers for test categorization
markers =
    # Test category markers
    unit: Unit tests - fast, no external dependencies, use mocks (deselect with '-m "not unit"')
    integration: Integration tests - may require local services or complex setup (deselect with '-m "not integration"')
    slow: Slow tests - takes > 10 seconds, requires extensive setup (deselect with '-m "not slow"')
    manual: Manual/debug tests not intended for automated runs (deselect with '-m "not manual"')
    e2e: End-to-end tests with running services (deselect with '-m "not e2e"')
    ci: CI workflow tests - simulate CI/CD pipeline steps (deselect with '-m "not ci"')
    
    # Dependency markers
    requires_grpc_server: Tests requiring a running gRPC server (deselect with '-m "not requires_grpc_server"')
    requires_http_server: Tests requiring a running HTTP server (deselect with '-m "not requires_http_server"')
    requires_llm: Tests requiring LLM service (deselect with '-m "not requires_llm"')
    
    # Test type markers
    smoke: Smoke tests - critical functionality checks
    regression: Regression tests - ensure bug fixes stay fixed

# Additional options
addopts = 
    --strict-markers
    --ignore=tests/manual
    --ignore=tests/fixtures
    --ignore=tests/helpers

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# ============================================================================
# TEST DIRECTORY STRUCTURE
# ============================================================================
#
# tests/
# ├── unit/                    - Unit tests (fast, isolated, mocked)
# ├── integration/             - Integration tests
# │   ├── graph/               - Graph builder tests
# │   ├── grpc/                - gRPC integration tests
# │   ├── http/                - HTTP/SSE integration tests
# │   └── llm/                 - LLM service tests
# ├── e2e/                     - End-to-end tests with running servers
# ├── external/                - Tests requiring real external APIs
# ├── manual/                  - Manual/debug scripts (not run in CI)
# ├── fixtures/                - Shared test data and fixtures
# ├── helpers/                 - Test utilities and helpers
# └── ci/                      - CI-specific scripts
#
# ============================================================================
# USAGE EXAMPLES
# ============================================================================
#
# Run only fast unit tests (for PR checks):
#   pytest -v -m "unit"
#
# Run unit and integration tests (exclude slow/external/manual):
#   pytest -v -m "not slow and not external and not manual and not e2e"
#
# Run all tests except manual/debug scripts:
#   pytest -v -m "not manual"
#
# Run E2E tests (requires running servers):
#   pytest -v -m "e2e"
#
# Run specific test directory:
#   pytest -v tests/unit/
#   pytest -v tests/integration/test_grpc/
#
# Run tests matching pattern:
#   pytest -v -k "chitchat"
#
# ============================================================================
