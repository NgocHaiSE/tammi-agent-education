# -*- coding: utf-8 -*-
# Supervisord Configuration for QA Agent
# Optimized for production performance
# 
# ENV Variable Injection:
# Supervisord reads environment variables from the Docker container
# and injects them into program commands using %(ENV_VAR_NAME)s syntax.
# This allows full externalization of configuration per 12-factor app.
[supervisord]
# Run in foreground mode (required for Docker)
nodaemon=true

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# HTTP Server Configuration - FastAPI with Gunicorn + Uvicorn
[program:http-server]
# Run FastAPI server with Gunicorn and Uvicorn workers
# All parameters configurable via ENV variables using %(ENV_VAR)s syntax
command=gunicorn -w %(ENV_GUNICORN_WORKERS)s -k %(ENV_GUNICORN_WORKER_CLASS)s --worker-connections %(ENV_GUNICORN_WORKER_CONNECTIONS)s --backlog %(ENV_GUNICORN_BACKLOG)s --max-requests %(ENV_GUNICORN_MAX_REQUESTS)s --max-requests-jitter %(ENV_GUNICORN_MAX_REQUESTS_JITTER)s --timeout %(ENV_GUNICORN_TIMEOUT)s --graceful-timeout %(ENV_GUNICORN_GRACEFUL_TIMEOUT)s --keep-alive %(ENV_GUNICORN_KEEP_ALIVE)s --worker-tmp-dir %(ENV_GUNICORN_WORKER_TMP_DIR)s --access-logfile %(ENV_GUNICORN_ACCESS_LOG)s --error-logfile %(ENV_GUNICORN_ERROR_LOG)s --log-level %(ENV_GUNICORN_LOG_LEVEL)s agent.entrypoint.http_server:app --bind 0.0.0.0:%(ENV_AGENT_HTTP_PORT)s
# Working directory
directory=/app
# Auto start when supervisord starts
autostart=true
# Auto restart on failure
autorestart=true
# Wait 30s before killing process (graceful shutdown)
stopwaitsecs=30
# Redirect stdout to supervisord stdout (Docker logs)
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
# Redirect stderr to supervisord stderr (Docker logs)
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# gRPC Server Configuration - Optimized with ENV Configuration
[program:grpc-server]
# Run gRPC server
# All parameters configurable via ENV variables
command=python -m agent.entrypoint.grpc_server
# Working directory
directory=/app
# Configure environment variables for gRPC server - All configurable via ENV
environment=AGENT_GRPC_HOST=%(ENV_AGENT_GRPC_HOST)s,AGENT_GRPC_PORT=%(ENV_AGENT_GRPC_PORT)s,GRPC_MAX_CONCURRENT_STREAMS=%(ENV_GRPC_MAX_CONCURRENT_STREAMS)s,GRPC_MAX_MESSAGE_SIZE_MB=%(ENV_GRPC_MAX_MESSAGE_SIZE_MB)s,GRPC_COMPRESSION=%(ENV_GRPC_COMPRESSION)s,GRPC_KEEPALIVE_TIME_MS=%(ENV_GRPC_KEEPALIVE_TIME_MS)s,GRPC_KEEPALIVE_TIMEOUT_MS=%(ENV_GRPC_KEEPALIVE_TIMEOUT_MS)s,GRPC_KEEPALIVE_MS=%(ENV_GRPC_KEEPALIVE_MS)s,GRPC_MAX_PING_STRIKES=%(ENV_GRPC_MAX_PING_STRIKES)s,GRPC_MIN_PING_INTERVAL_MS=%(ENV_GRPC_MIN_PING_INTERVAL_MS)s,GRPC_USE_TLS=%(ENV_GRPC_USE_TLS)s,GRPC_DEFAULT_TIMEOUT=%(ENV_GRPC_DEFAULT_TIMEOUT)s,GRPC_RETRY_COUNT=%(ENV_GRPC_RETRY_COUNT)s,GRPC_RETRY_BACKOFF_BASE_SECONDS=%(ENV_GRPC_RETRY_BACKOFF_BASE_SECONDS)s,GRPC_RETRY_MAX_BACKOFF_SECONDS=%(ENV_GRPC_RETRY_MAX_BACKOFF_SECONDS)s
# Auto start when supervisord starts
autostart=true
# Auto restart on failure
autorestart=true
# Wait 5s to consider started successfully  
startsecs=5
# Retry up to 3 times on failure
startretries=3
# Wait 30s before killing process (graceful shutdown)
stopwaitsecs=30
# Redirect stdout to supervisord stdout (Docker logs)
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
# Redirect stderr to supervisord stderr (Docker logs)
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0